<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GATELAB — logic gate &amp; flip-flop simulator</title>
<script>
/* error reporter — installed FIRST so it catches every later failure */
(function(){
  var shown=false;
  function show(msg){
    if(!document.body){ setTimeout(function(){ show(msg); },50); return; }
    if(shown) return;
    shown=true;
    var d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#3a1512;color:#ffb4ae;'+
      'font:12px/1.5 monospace;padding:10px 14px;border-bottom:1px solid #5c3532;white-space:pre-wrap';
    d.textContent='GATELAB error: '+msg+'\nReload the page. If this repeats, report this exact message.';
    document.body.appendChild(d);
  }
  window.gatelabFatal=show;
  window.addEventListener('error',function(ev){
    show(ev.message || ('error at line '+(ev.lineno||'?')));
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0c; --panel:#161614; --panel2:#22211d; --line:#2a2924; --line2:#3a3830;
  --text:#e9e6dc; --dim:#8d897d; --faint:#5b584e;
  --amber:#f0a63c; --amber2:#ffce7a; --red:#ff5d55; --green:#3ecf7a;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Space Grotesk",sans-serif;
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.mono{font-family:"IBM Plex Mono",monospace}
button{font-family:inherit;color:inherit}
.ic{width:16px;height:16px;flex-shrink:0}
canvas{-webkit-user-drag:none}

#top{display:flex;align-items:center;gap:4px;height:50px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow:visible;z-index:30;position:relative}
.brand{font-weight:700;font-size:17px;letter-spacing:.05em;margin-right:12px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand b{color:var(--amber);font-weight:700}
.tbtn{display:flex;align-items:center;gap:7px;padding:6px 11px;background:none;border:1px solid transparent;
  border-radius:8px;color:var(--dim);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--panel2);color:var(--text)}
.tbtn:active{transform:translateY(1px)}
.tbtn.icon{padding:6px 8px}
.tbtn:disabled{opacity:.3;cursor:default;transform:none}
.tsep{width:1px;height:22px;background:var(--line);margin:0 7px;flex-shrink:0}
.tspace{flex:1}
.save{font:500 11px "IBM Plex Mono",monospace;color:var(--dim);margin-left:12px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.save::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);transition:background .3s}
.save.busy::before{background:var(--amber)}
.save.err::before{background:var(--red)}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;background:#1b1a17;border:1px solid var(--line2);
  border-radius:10px;min-width:230px;max-height:70vh;overflow:auto;padding:6px;display:none;
  box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:40}
.menu.open{display:block}
.m-item{display:block;width:100%;text-align:left;padding:8px 11px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--text)}
.m-item:hover{background:var(--panel2)}
.m-item small{display:block;color:var(--dim);font-size:11px;margin-top:2px}

#main{flex:1;display:flex;min-height:0}
#pal{width:158px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:4px 0 24px;flex-shrink:0;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pal::-webkit-scrollbar{width:8px}
#pal::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.pal-h{font:600 10px "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:14px 14px 7px}
/* --- touch/iPad: items allow vertical scroll (pan-y); drag-to-canvas is handled in JS --- */
.pal-item{display:block;width:100%;padding:6px 8px 8px;background:none;border:0;border-radius:8px;cursor:grab;
  text-align:center;color:var(--dim);touch-action:pan-y}
.pal-item:hover{background:var(--panel2);color:var(--text)}
.pal-item.on{background:#241c0e;color:var(--amber);box-shadow:inset 0 0 0 1px #4a3812}
.pal-item canvas{display:block;margin:0 auto 4px;pointer-events:none}
.pal-item span{font-weight:600;font-size:11.5px;letter-spacing:.02em}
/* --- collapsible palette sections (Option 2) --- */
.pal-toggle{cursor:pointer;width:100%;text-align:left;background:none;border:0;
  display:flex;align-items:center;gap:7px;user-select:none;-webkit-user-select:none}
.pal-toggle:hover{color:var(--dim)}
.pal-toggle .caret{display:inline-block;width:10px;font-size:9px;transition:transform .15s ease}
.pal-sec.fold .pal-toggle .caret{transform:rotate(-90deg)}
.pal-sec.fold .pal-item{display:none}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
/* --- wire delete button (shown on the selected wire) --- */
#wireDel{position:absolute;width:34px;height:34px;border-radius:50%;background:#241716;border:1px solid #5c3532;
  color:#ff8d86;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:25;
  box-shadow:0 4px 14px rgba(0,0,0,.45);transform:translate(-50%,-50%);padding:0}
#wireDel:hover{background:#2c1a18}
#wireDel .ic{width:14px;height:14px}

#status{display:flex;align-items:center;gap:12px;height:32px;padding:0 12px;background:var(--panel);
  border-top:1px solid var(--line);font:500 11.5px "IBM Plex Mono",monospace;color:var(--dim)}
#statMsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
#statMsg.warn{color:var(--amber);font-weight:600}
.grow{flex:1}
#statXY{min-width:92px;text-align:right}
#statZoom{min-width:44px;text-align:right}
#statCounts{white-space:nowrap}
.sbtn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);
  font:600 10.5px "IBM Plex Mono",monospace;padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:5px;letter-spacing:.08em}
.sbtn:hover{color:var(--text);border-color:var(--line2)}
.sbtn.on{color:var(--amber);border-color:#4a3812}
.sbtn .ic{width:13px;height:13px}

#inspector{position:absolute;top:14px;right:14px;width:218px;background:rgba(22,22,20,.95);
  border:1px solid var(--line2);border-radius:10px;padding:12px 13px;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.insp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#inspType{font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.xbtn{background:none;border:0;color:var(--dim);cursor:pointer;padding:4px;display:flex;border-radius:6px}
.xbtn:hover{background:var(--panel2);color:var(--text)}
.fld{display:block;font:600 10px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.fld input,.fld select{display:block;width:100%;margin-top:5px;background:#101010;border:1px solid var(--line2);
  border-radius:7px;color:var(--text);font:500 12.5px "IBM Plex Mono",monospace;padding:6px 8px;outline:none;user-select:text;-webkit-user-select:text}
.fld input:focus,.fld select:focus{border-color:var(--amber)}
.seqctl{display:flex;align-items:center;gap:8px;margin:-6px 0 10px}
#inspQ{font:700 15px "IBM Plex Mono",monospace;color:var(--amber);min-width:16px}
.seqctl .btn{padding:5px 10px;font-size:11.5px}
.insp-actions{display:flex;gap:8px;margin-top:2px}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 13px;background:#1c1b18;
  border:1px solid var(--line2);border-radius:8px;color:var(--text);font-weight:600;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:#4a4740;background:var(--panel2)}
.btn.danger{color:#ff8d86}
.btn.danger:hover{border-color:#5c3532;background:#241716}

#hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(22,22,20,.95);
  border:1px solid var(--line2);border-radius:999px;padding:7px 8px 7px 16px;display:flex;align-items:center;gap:10px;
  font:500 11.5px "IBM Plex Mono",monospace;color:var(--dim);white-space:nowrap;max-width:94%;overflow:hidden}
#hint em{color:var(--amber);font-style:normal}

#modal{position:fixed;inset:0;background:rgba(8,8,7,.74);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#modalCard{width:min(640px,94vw);max-height:84vh;overflow:auto;background:#171715;border:1px solid var(--line2);
  border-radius:12px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#modalCard.wide{width:min(780px,96vw)}
.m-title{font-weight:700;font-size:17px;margin-bottom:14px;letter-spacing:.02em}
.m-body{color:var(--dim);font-size:13.5px;margin-bottom:18px;line-height:1.55}
.m-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.m-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.m-cols h4{font:600 10px "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin:12px 0 8px}
.m-cols ul{list-style:none}
.m-cols li{color:var(--dim);font-size:12.5px;line-height:1.5;padding:3px 0 3px 14px;position:relative}
.m-cols li::before{content:'';position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:1px;background:var(--faint)}
.keys{border-collapse:collapse;font:400 12px "IBM Plex Mono",monospace}
.keys td{padding:4px 8px 4px 0;color:var(--dim)}
.keys td:first-child{color:var(--text);white-space:nowrap}
kbd{background:#201f1b;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:500 10.5px "IBM Plex Mono",monospace}
.foot-note{margin-top:12px;font:400 11px "IBM Plex Mono",monospace;color:var(--faint);line-height:1.6}

.ttwrap{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:9px}
table.tt{border-collapse:collapse;font:12.5px "IBM Plex Mono",monospace;width:100%}
.tt th,.tt td{padding:5px 13px;text-align:center;border-bottom:1px solid var(--line)}
.tt thead th{position:sticky;top:0;background:#171715;color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.tt tbody tr:hover{background:#1d1c19}
.tt .ix{color:var(--faint);text-align:right}
.tt .sep{border-left:1px solid var(--line2);background:none;padding:0;width:1px}
.tt td.z{color:var(--faint)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;align-items:center}
.toast{background:#1d1c19;border:1px solid var(--line2);border-left:3px solid var(--amber);border-radius:8px;
  padding:9px 15px;font:500 12px "IBM Plex Mono",monospace;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);
  animation:tin .22s ease}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
.toast.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header id="top">
  <div class="brand">
    <svg width="24" height="16" viewBox="0 0 24 16" fill="none" stroke="#f0a63c" stroke-width="1.8" stroke-linecap="round">
      <path d="M3 1.5h7a6.5 6.5 0 010 13H3z"/><path d="M0 5.2h3M0 10.8h3M16.5 8H24"/>
    </svg>
    GATE<b>LAB</b>
  </div>
  <div class="tgroup" style="display:flex;gap:2px">
    <button class="tbtn" id="btnNew" title="New circuit"><span id="icNew"></span>New</button>
    <div class="dd">
      <button class="tbtn" id="btnEx" title="Load an example"><span id="icEx"></span>Examples</button>
      <div class="menu" id="exMenu"></div>
    </div>
  </div>
  <div class="tsep"></div>
  <div class="tgroup" style="display:flex;gap:2px">
    <button class="tbtn icon" id="btnUndo" title="Undo (Ctrl+Z)"></button>
    <button class="tbtn icon" id="btnRedo" title="Redo (Ctrl+Shift+Z)"></button>
  </div>
  <div class="tsep"></div>
  <div class="tgroup" style="display:flex;gap:2px">
    <button class="tbtn" id="btnImport" title="Import a .json circuit"><span id="icImp"></span>Import</button>
    <button class="tbtn" id="btnExport" title="Export circuit as .json"><span id="icExp"></span>Export</button>
  </div>
  <div class="tspace"></div>
  <button class="tbtn" id="btnTruth" title="Generate truth table (T)"><span id="icTt"></span>Truth table</button>
  <button class="tbtn icon" id="btnHelp" title="Help (?)"></button>
  <span id="saveState" class="save">saved</span>
</header>

<div id="main">
  <aside id="pal"></aside>
  <div id="stage">
    <canvas id="cv" draggable="false"></canvas>
    <div id="inspector" hidden>
      <div class="insp-head"><span id="inspType"></span><button class="xbtn" id="inspClose" title="Close"></button></div>
      <label class="fld" id="lblRow">Label<input id="inpLabel" maxlength="12" spellcheck="false"></label>
      <div id="seqRow" hidden>
        <label class="fld">State · Q</label>
        <div class="seqctl">
          <span id="inspQ">0</span>
          <button class="btn" id="inspSet" title="Force Q high">Set</button>
          <button class="btn" id="inspClr" title="Force Q low">Rst</button>
        </div>
      </div>
      <label class="fld" id="clkRow" hidden>Speed
        <select id="inpSpeed">
          <option value="2000">0.5 Hz</option><option value="1000">1 Hz</option>
          <option value="500">2 Hz</option><option value="250">4 Hz</option><option value="125">8 Hz</option>
        </select>
      </label>
      <div class="insp-actions">
        <button class="btn" id="inspRot" title="Rotate (R)">Rotate</button>
        <button class="btn danger" id="inspDel" title="Delete (Del)">Delete</button>
      </div>
    </div>
    <div id="hint" hidden>
      <span>The LEDs divide the clock by <em>2 · 4 · 8</em> &nbsp;·&nbsp; flip <em>EN</em> to freeze the count &nbsp;·&nbsp; drag new parts in from the palette</span>
      <button class="xbtn" id="hintClose" title="Dismiss"></button>
    </div>
    <!-- --- wire delete: floating ✕ that sits on the selected wire --- -->
    <button id="wireDel" title="Delete wire" hidden></button>
  </div>
</div>

<footer id="status">
  <span id="statMsg"></span>
  <span class="grow"></span>
  <span id="statXY" class="mono">—</span>
  <span id="statZoom" class="mono">100%</span>
  <span class="tsep"></span>
  <button class="sbtn" id="btnFit" title="Zoom to fit (F)"></button>
  <button class="sbtn on" id="btnLabels" title="Show / hide labels">LABELS</button>
  <span id="statCounts" class="mono"></span>
</footer>

<div id="modal" hidden><div id="modalCard"></div></div>
<div id="toasts"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* =============================================================
   GATELAB — client-side logic gate & flip-flop schematic editor.
   Single file: data model, event-driven simulation engine (unit
   delay + edge detection), canvas renderer, drag-and-drop editor,
   persistence, boot self-test, visible error reporting.
   Includes 3- and 4-input variants of AND / OR / NAND / NOR,
   touch/iPad-friendly palette (scrollable + collapsible sections),
   and per-wire deletion (tap ✕ / double-tap / Del key).
   ============================================================= */

function fatal(msg){ if(typeof window.gatelabFatal==='function') window.gatelabFatal(msg); }

/* ---------------- utilities ---------------- */
const $ = s => document.querySelector(s);
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const GRID = 20;                       // visual grid dots only — placement is free
const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function withAlpha(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function rr(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
const labelSort=(a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true});

const IC = {
  file:'<rect x="3" y="3" width="12" height="12" rx="2"/><path d="M9 6.8v4.4M6.8 9h4.4"/>',
  layers:'<path d="M9 2.6l6.5 3.7L9 10 2.5 6.3z"/><path d="M4.4 10.7L9 13.3l4.6-2.6"/>',
  up:'<path d="M9 12.2V3.6M5.8 6.4L9 3.2l3.2 3.2"/><path d="M3.5 12.6v2h11v-2"/>',
  down:'<path d="M9 3.6v8.6M5.8 9.4L9 12.6l3.2-3.2"/><path d="M3.5 12.6v2h11v-2"/>',
  undo:'<path d="M4.2 7h5.3a2.5 2.5 0 010 5H7"/><path d="M6.8 4.2L4 7l2.8 2.8"/>',
  redo:'<path d="M13.8 7H8.5a2.5 2.5 0 000 5H11"/><path d="M11.2 4.2L14 7l-2.8 2.8"/>',
  table:'<rect x="2.8" y="3.2" width="12.4" height="11.6" rx="1.6"/><path d="M2.8 7.2h12.4M7.8 7.2v7.6"/>',
  help:'<circle cx="9" cy="9" r="6.8"/><path d="M7.2 6.8a1.9 1.9 0 113.1 1.5c-.7.55-1.1 1-1.1 1.8"/><path d="M9.2 13.3h.01"/>',
  fit:'<path d="M3 6.4V3h3.4M15 6.4V3h-3.4M3 11.6V15h3.4M15 11.6V15h-3.4"/>',
  x:'<path d="M4.6 4.6l8.8 8.8M13.4 4.6l-8.8 8.8"/>'
};
const icon = n => `<svg class="ic" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

/* ---------------- component catalog ---------------- */
const CAT = {
  SW:  {kind:'in',  ins:0, outs:1, prefix:'S',  name:'Switch'},
  CLK: {kind:'in',  ins:0, outs:1, prefix:'C',  name:'Clock'},
  NOT: {kind:'gate',ins:1, outs:1, prefix:'G',  name:'NOT'},
  BUF: {kind:'gate',ins:1, outs:1, prefix:'G',  name:'Buffer'},
  AND: {kind:'gate',ins:2, outs:1, prefix:'G',  name:'AND'},
  OR:  {kind:'gate',ins:2, outs:1, prefix:'G',  name:'OR'},
  NAND:{kind:'gate',ins:2, outs:1, prefix:'G',  name:'NAND'},
  NOR: {kind:'gate',ins:2, outs:1, prefix:'G',  name:'NOR'},
  XOR: {kind:'gate',ins:2, outs:1, prefix:'G',  name:'XOR'},
  XNOR:{kind:'gate',ins:2, outs:1, prefix:'G',  name:'XNOR'},
  /* --- 3/4-input gates (added) --- */
  AND3:{kind:'gate',ins:3, outs:1, prefix:'G',  name:'AND ×3'},
  AND4:{kind:'gate',ins:4, outs:1, prefix:'G',  name:'AND ×4'},
  OR3: {kind:'gate',ins:3, outs:1, prefix:'G',  name:'OR ×3'},
  OR4: {kind:'gate',ins:4, outs:1, prefix:'G',  name:'OR ×4'},
  NAND3:{kind:'gate',ins:3, outs:1, prefix:'G', name:'NAND ×3'},
  NAND4:{kind:'gate',ins:4, outs:1, prefix:'G', name:'NAND ×4'},
  NOR3:{kind:'gate',ins:3, outs:1, prefix:'G',  name:'NOR ×3'},
  NOR4:{kind:'gate',ins:4, outs:1, prefix:'G',  name:'NOR ×4'},
  /* --- end added gates --- */
  SRL: {kind:'seq', ins:2, outs:2, prefix:'SR', name:'SR latch'},
  DFF: {kind:'seq', ins:4, outs:2, prefix:'FF', name:'D flip-flop'},
  JKFF:{kind:'seq', ins:4, outs:2, prefix:'FF', name:'JK flip-flop'},
  TFF: {kind:'seq', ins:4, outs:2, prefix:'FF', name:'T flip-flop'},
  LEDR:{kind:'out', ins:1, outs:0, prefix:'L', name:'LED', color:'#ff5d55', key:'red'},
  LEDG:{kind:'out', ins:1, outs:0, prefix:'L', name:'LED', color:'#3ecf7a', key:'green'},
  LEDY:{kind:'out', ins:1, outs:0, prefix:'L', name:'LED', color:'#ffc043', key:'amber'},
};
const isLED = t => CAT[t] && CAT[t].kind==='out';
const isSeq = t => CAT[t] && CAT[t].kind==='seq';
const isFF  = t => t==='DFF' || t==='JKFF' || t==='TFF';

/* Flip-flop pins: 0=data (D/J/T), 1=CLK, 2=PRE, 3=CLR; outs: 0=Q, 1=Qbar. */
function localTerms(c){
  const t=c.type;
  if(t==='SW'||t==='CLK') return {ins:[], outs:[[40,0]]};
  if(isLED(t)) return {ins:[[-40,0]], outs:[]};
  if(t==='SRL') return {ins:[[-34,-10],[-34,10]], outs:[[34,-10],[34,10]]};
  if(isFF(t)) return {ins:[[-40,-18],[-40,-6],[-40,6],[-40,18]], outs:[[40,-12],[40,12]]};
  const d=CAT[t];
  /* --- pin positions scale with input count (added 3/4-input rows) --- */
  let ins;
  switch(d.ins){
    case 2:  ins=[[-46,-11],[-46,11]];                  break;
    case 3:  ins=[[-46,-16],[-46,0],[-46,16]];          break;
    case 4:  ins=[[-46,-21],[-46,-7],[-46,7],[-46,21]]; break;
    default: ins=[[-46,0]];
  }
  return {ins, outs:[[46,0]]};
}
function termWorld(c, side, idx){
  const t=localTerms(c);
  const p = side==='in' ? t.ins[idx] : t.outs[idx];
  let wx, wy;
  switch(c.rot&3){
    case 0: wx=p[0]; wy=p[1]; break;
    case 1: wx=-p[1]; wy=p[0]; break;
    case 2: wx=-p[0]; wy=-p[1]; break;
    default: wx=p[1]; wy=-p[0];
  }
  return [wx+c.x, wy+c.y];
}
function bodyBox(c){
  const t=c.type;
  if(t==='SW'||t==='CLK') return [32,22];
  if(isLED(t)) return [24,24];
  if(t==='SRL') return [30,20];
  if(isFF(t)) return [36,28];
  /* --- hit box grows slightly for 3/4-input gates (added) --- */
  const d=CAT[t];
  if(d.kind==='gate'&&d.ins===3) return [44,25];
  if(d.kind==='gate'&&d.ins===4) return [44,26];
  return [44,24];
}
function compHit(c, wx, wy){
  let lx, ly; const dx=wx-c.x, dy=wy-c.y;
  switch(c.rot&3){
    case 0: lx=dx; ly=dy; break;
    case 1: lx=dy; ly=-dx; break;
    case 2: lx=-dx; ly=-dy; break;
    default: lx=-dy; ly=dx;
  }
  const [hw,hh]=bodyBox(c);
  return Math.abs(lx)<=hw && Math.abs(ly)<=hh;
}

/* ---------------- state ---------------- */
let comps = [], wires = [];
let byId = new Map();
let view = {x:0, y:0, z:1};
const sel = {comps:new Set(), wires:new Set()};
let placing = null;
let pendingWire = null;
let drag = null;
let palDrag = null;
let hover = null, mouseWorld = null, spaceHeld = false;
const pointers = new Map();
let simUnstable = false, showLabels = true, flowPhase = 0;
let inspFor = null;
let idC = 1, idW = 1;
let lastWire = null;              /* --- wire delete: for double-tap detection --- */
let lastPointerType = 'mouse';    /* --- touch/iPad: fatter wire hit area for fingers --- */
const uid = ()=>'c'+(idC++);
const wid = ()=>'w'+(idW++);

function reindex(){ byId = new Map(comps.map(c=>[c.id,c])); }
function nextLabel(type){
  const p = CAT[type].prefix, used = new Set(comps.map(c=>c.label));
  let n=1; while(used.has(p+n)) n++;
  return p+n;
}
function mkComp(type,x,y,extra={}){
  const d = CAT[type];
  const c = {id:uid(), type, x:Math.round(x), y:Math.round(y), rot:0,
             label:nextLabel(type), in:new Array(d.ins).fill(0), out:new Array(d.outs).fill(0)};
  if(type==='SW') c.state=0;
  if(type==='CLK') c.period=1000;
  if(isSeq(type)){ c.q=0; c.pc=0; c.fresh=true; }
  return Object.assign(c, extra);
}
function addWire(src,dst){
  const old = wires.findIndex(w=>w.to.c===dst.c && w.to.i===dst.i);
  if(old>=0) wires.splice(old,1);
  const w = {id:wid(), from:{...src}, to:{...dst}};
  wires.push(w); return w;
}
function selClear(){ sel.comps.clear(); sel.wires.clear(); updateInspector(); }
function selPrune(){
  for(const id of [...sel.comps]) if(!byId.has(id)) sel.comps.delete(id);
  for(const id of [...sel.wires]) if(!wires.some(w=>w.id===id)) sel.wires.delete(id);
  updateInspector();
}
function cancelModes(){ placing=null; pendingWire=null; palDrag=null; if(drag&&drag.mode!=='pinch') drag=null; syncPalette(); updateStatusUI(); }

/* ---------------- simulation engine ---------------- */
const simOpts = {freezeClocks:false};

function evalComp(c, now){
  const i = c.in;
  switch(c.type){
    case 'SW':   return [c.state?1:0];
    case 'CLK':  return [simOpts.freezeClocks?0:(((now % c.period) < c.period*0.5)?1:0)];
    case 'NOT':  return [i[0]?0:1];
    case 'BUF':  return [i[0]?1:0];
    case 'AND':  return [(i[0]&&i[1])?1:0];
    case 'OR':   return [(i[0]||i[1])?1:0];
    case 'NAND': return [(i[0]&&i[1])?0:1];
    case 'NOR':  return [(i[0]||i[1])?0:1];
    case 'XOR':  return [i[0]^i[1]];
    case 'XNOR': return [1-(i[0]^i[1])];
    /* --- 3/4-input gate logic (added) --- */
    case 'AND3': return [(i[0]&&i[1]&&i[2])?1:0];
    case 'AND4': return [(i[0]&&i[1]&&i[2]&&i[3])?1:0];
    case 'OR3':  return [(i[0]||i[1]||i[2])?1:0];
    case 'OR4':  return [(i[0]||i[1]||i[2]||i[3])?1:0];
    case 'NAND3':return [(i[0]&&i[1]&&i[2])?0:1];
    case 'NAND4':return [(i[0]&&i[1]&&i[2]&&i[3])?0:1];
    case 'NOR3': return [(i[0]||i[1]||i[2])?0:1];
    case 'NOR4': return [(i[0]||i[1]||i[2]||i[3])?0:1];
    /* --- end added --- */
    case 'SRL':
      if(i[0]||i[1]) c.q=(i[0]&&!i[1])?1:0;
      return [c.q, 1-c.q];
    case 'DFF': case 'JKFF': case 'TFF':{
      let q=c.q;
      if(i[2]) q=1; else if(i[3]) q=0;
      return [q, 1-q];
    }
    default: return [];
  }
}
function settle(now, maxPass=120){
  let pass=0, changed=true;
  while(changed && pass<maxPass){
    changed=false; pass++;
    for(const c of comps) c.in.fill(0);
    for(const w of wires){
      const s=byId.get(w.from.c), t=byId.get(w.to.c);
      if(!s||!t) continue;
      if(w.from.i<s.out.length && w.to.i<t.in.length) t.in[w.to.i]=s.out[w.from.i];
    }
    for(const c of comps){
      const o=evalComp(c,now);
      for(let k=0;k<o.length;k++) if(o[k]!==c.out[k]){ c.out[k]=o[k]; changed=true; }
    }
  }
  const u = changed;
  if(u!==simUnstable){ simUnstable=u; updateStatusUI(); }
  return !u;
}
function edgePhase(){
  let changed=false;
  for(const c of comps){
    if(!isFF(c.type)) continue;
    const i=c.in, cur=i[1];
    if(i[2]){ if(c.q!==1){ c.q=1; changed=true; } }
    else if(i[3]){ if(c.q!==0){ c.q=0; changed=true; } }
    else if(!c.fresh && cur===1 && c.pc===0){
      let nq=c.q;
      if(c.type==='DFF')       nq = i[0]?1:0;
      else if(c.type==='JKFF') nq = (i[0]&&i[1]) ? 1-c.q : i[0]?1 : (i[1]?0:c.q);
      else                     nq = i[0] ? 1-c.q : c.q;
      if(nq!==c.q){ c.q=nq; changed=true; }
    }
    if(c.fresh) c.fresh=false;
    c.pc=cur;
  }
  return changed;
}
function simulate(now){
  let stable = settle(now);
  for(let k=0;k<8;k++){
    if(!edgePhase()) break;
    if(!settle(now)) stable=false;
  }
  return stable;
}

/* ---------------- serialization ---------------- */
function serialize(){
  return JSON.stringify({v:4,
    comps: comps.map(c=>{
      const o={id:c.id,type:c.type,x:c.x,y:c.y,rot:c.rot,label:c.label};
      if(c.type==='SW') o.state=c.state?1:0;
      if(c.type==='CLK') o.period=c.period;
      if(isSeq(c.type)) o.q=c.q?1:0;
      return o;
    }),
    wires: wires.map(w=>({id:w.id, from:{...w.from}, to:{...w.to}}))});
}
function sanitize(data){
  if(!data || typeof data!=='object') throw new Error('not a JSON object');
  if(!Array.isArray(data.comps) || !Array.isArray(data.wires)) throw new Error('missing comps / wires arrays');
  const nc=[], ids=new Set();
  for(const raw of data.comps.slice(0,600)){
    if(!raw || typeof raw!=='object') continue;
    const d = CAT[raw.type]; if(!d) continue;
    const x=+raw.x, y=+raw.y;
    if(!isFinite(x)||!isFinite(y)) continue;
    if(typeof raw.id!=='string' || raw.id.length>12 || ids.has(raw.id)) continue;
    ids.add(raw.id);
    const c={id:raw.id, type:raw.type,
      x:clamp(Math.round(x),-99999,99999), y:clamp(Math.round(y),-99999,99999),
      rot:((+raw.rot|0)&3)||0,
      label:(typeof raw.label==='string'?raw.label:'').slice(0,12),
      in:new Array(d.ins).fill(0), out:new Array(d.outs).fill(0)};
    if(c.type==='SW') c.state=raw.state?1:0;
    if(c.type==='CLK') c.period=clamp(+raw.period||1000,100,4000);
    if(isSeq(c.type)){ c.q=raw.q?1:0; c.pc=0; c.fresh=true; }
    nc.push(c);
  }
  const by = new Map(nc.map(c=>[c.id,c]));
  const nw=[], seenIn=new Set(), usedW=new Set(); let dropped=0;
  for(const raw of data.wires.slice(0,1200)){
    if(!raw || typeof raw!=='object') continue;
    const f=raw.from, t=raw.to;
    if(!f || !t || f.t!=='out' || t.t!=='in'){ dropped++; continue; }
    const s=by.get(f.c), d2=by.get(t.c);
    if(!s || !d2){ dropped++; continue; }
    if(!(f.i>=0 && f.i<CAT[s.type].outs) || !(t.i>=0 && t.i<CAT[d2.type].ins)){ dropped++; continue; }
    const key=t.c+':'+t.i;
    if(seenIn.has(key)){ dropped++; continue; }
    seenIn.add(key);
    const id = (typeof raw.id==='string' && raw.id.length<=12 && !usedW.has(raw.id)) ? raw.id : wid();
    usedW.add(id);
    nw.push({id, from:{c:f.c,t:'out',i:f.i|0}, to:{c:t.c,t:'in',i:t.i|0}});
  }
  idC = nc.reduce((m,c)=>Math.max(m,(+String(c.id).replace(/\D/g,'')||0)),0)+1;
  idW = nw.reduce((m,w)=>Math.max(m,(+String(w.id).replace(/\D/g,'')||0)),0)+1;
  return {comps:nc, wires:nw, dropped};
}
function loadData(str){
  const d = sanitize(JSON.parse(str));
  comps=d.comps; wires=d.wires; reindex();
  selPrune(); cancelModes(); markDirty(); updateCounts();
  return d;
}

/* ---------------- history ---------------- */
const hist = {u:[], r:[]};
function pushHist(s){
  hist.u.push(s===undefined? serialize() : s);
  if(hist.u.length>60) hist.u.shift();
  hist.r.length=0; refreshHistBtns();
}
function doUndo(){ if(!hist.u.length) return; hist.r.push(serialize()); loadData(hist.u.pop()); refreshHistBtns(); }
function doRedo(){ if(!hist.r.length) return; hist.u.push(serialize()); loadData(hist.r.pop()); refreshHistBtns(); }
function refreshHistBtns(){ $('#btnUndo').disabled=!hist.u.length; $('#btnRedo').disabled=!hist.r.length; }

/* ---------------- persistence ---------------- */
const KEY='gatelab.circuit.v4';
const FOLDKEY='gatelab.pal.fold';   /* --- collapsible sections: remembered folds --- */
let saveTimer=null;
function setSave(st){ const el=$('#saveState'); el.className='save'+(st==='busy'?' busy':st==='err'?' err':''); el.textContent=st==='busy'?'saving':st==='err'?'not saved':'saved'; }
function markDirty(){ setSave('busy'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,700); }
function saveNow(){
  clearTimeout(saveTimer);
  try{ localStorage.setItem(KEY, serialize()); setSave('ok'); }catch(e){ setSave('err'); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveNow(); });
window.addEventListener('beforeunload', saveNow);

/* ---------------- canvas ---------------- */
const canvas=$('#cv'), ctx=canvas.getContext('2d');
let cssW=0, cssH=0, dpr=1, pendingFit=false;
function resize(){
  const r=$('#stage').getBoundingClientRect();
  cssW=r.width; cssH=r.height; dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(cssW*dpr));
  canvas.height=Math.max(1,Math.round(cssH*dpr));
  if(pendingFit && cssW>0){ pendingFit=false; zoomFit(); }
}
new ResizeObserver(resize).observe($('#stage'));

const COL={body:'#1a1a17', stroke:'#b9b5a6', stub:'#4f4d44', hot:'#f0a63c', term:'#8d897d'};

function zoomAt(sx,sy,f){
  const nz=clamp(view.z*f, .25, 2.5);
  const wx=(sx-view.x)/view.z, wy=(sy-view.y)/view.z;
  view.z=nz; view.x=sx-wx*nz; view.y=sy-wy*nz;
  updateViewUI();
}
function zoomFit(){
  if(cssW===0){ pendingFit=true; return; }
  if(!comps.length){ view={x:cssW/2,y:cssH/2,z:1}; updateViewUI(); return; }
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  for(const c of comps){ x1=Math.min(x1,c.x-80); y1=Math.min(y1,c.y-80); x2=Math.max(x2,c.x+80); y2=Math.max(y2,c.y+80); }
  view.z=clamp(Math.min(cssW/(x2-x1), cssH/(y2-y1)), .25, 1.6);
  view.x=(cssW-(x1+x2)*view.z)/2; view.y=(cssH-(y1+y2)*view.z)/2;
  updateViewUI();
}

/* ---------------- rendering ---------------- */
function render(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0e0e0c'; ctx.fillRect(0,0,cssW,cssH);
  drawGrid();

  ctx.save(); ctx.translate(view.x,view.y); ctx.scale(view.z,view.z);
  ctx.lineCap='round';
  drawWires();
  drawPendingWire();
  for(const c of comps) drawCompWorld(c, now);
  if(placing && mouseWorld){
    drawGhost(placing.type, Math.round(mouseWorld[0]), Math.round(mouseWorld[1]), placing.rot);
  }
  if(palDrag && palDrag.moved && palDrag.over && isFinite(palDrag.wx)){
    drawGhost(palDrag.type, Math.round(palDrag.wx), Math.round(palDrag.wy), 0);
  }
  if(drag && drag.mode==='marquee' && drag.curW){
    const x=Math.min(drag.startW[0],drag.curW[0]), y=Math.min(drag.startW[1],drag.curW[1]);
    const w=Math.abs(drag.curW[0]-drag.startW[0]), h=Math.abs(drag.curW[1]-drag.startW[1]);
    ctx.fillStyle='rgba(240,166,60,.06)'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgba(240,166,60,.7)'; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);
  }
  ctx.restore();
}
function drawGhost(type,x,y,rot){
  const g={id:'_g', type, x, y, rot, label:'', state:0, period:1000, q:0, pc:0, fresh:true,
    in:new Array(CAT[type].ins).fill(0), out:new Array(CAT[type].outs).fill(0)};
  ctx.save(); ctx.globalAlpha=.55; ctx.translate(g.x,g.y); ctx.rotate(g.rot*Math.PI/2);
  drawBody(ctx,g,0); ctx.restore();
}
function drawGrid(){
  let s=GRID*view.z;
  while(s<14) s*=2; while(s>36) s/=2;
  ctx.fillStyle='#1e1d18';
  const x0=((view.x%s)+s)%s, y0=((view.y%s)+s)%s;
  for(let x=x0;x<cssW;x+=s) for(let y=y0;y<cssH;y+=s) ctx.fillRect(x-1,y-1,2,2);
}
function bezierPts(p1,p2){
  const k=clamp(Math.abs(p2[0]-p1[0])*0.5, 34, 160);
  return [[p1[0]+k,p1[1]],[p2[0]-k,p2[1]]];
}
function wireCPath(p1,p2){
  const [c1,c2]=bezierPts(p1,p2);
  ctx.beginPath(); ctx.moveTo(p1[0],p1[1]);
  ctx.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],p2[0],p2[1]);
}
function drawWires(){
  for(const w of wires){
    const s=byId.get(w.from.c), t=byId.get(w.to.c);
    if(!s||!t) continue;
    const p1=termWorld(s,'out',w.from.i), p2=termWorld(t,'in',w.to.i);
    const val=s.out[w.from.i]?1:0;
    const selW=sel.wires.has(w.id), hov=hover&&hover.type==='wire'&&hover.id===w.id;
    if(selW||hov){ ctx.strokeStyle=withAlpha('#f0a63c',selW?.35:.18); ctx.lineWidth=9; wireCPath(p1,p2); ctx.stroke(); }
    ctx.strokeStyle=val?'#f0a63c':'#45443d'; ctx.lineWidth=2.2; wireCPath(p1,p2); ctx.stroke();
    if(val){
      ctx.save(); ctx.strokeStyle='#ffdfae'; ctx.lineWidth=2.2;
      ctx.setLineDash([2.5,11]); ctx.lineDashOffset=-flowPhase;
      wireCPath(p1,p2); ctx.stroke(); ctx.restore();
    }
  }
}
function drawPendingWire(){
  if(!pendingWire) return;
  const c=byId.get(pendingWire.c); if(!c) return;
  const p1=termWorld(c,pendingWire.t,pendingWire.i);
  const p2=(hover&&hover.type==='term')? termWorld(byId.get(hover.c),hover.t,hover.i) : mouseWorld;
  if(!p2) return;
  ctx.strokeStyle='#f0a63c'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
  wireCPath(p1,p2); ctx.stroke(); ctx.setLineDash([]);
}
function drawCompWorld(c, now){
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate((c.rot&3)*Math.PI/2);
  drawBody(ctx,c,now);
  if(sel.comps.has(c.id)){
    const [hw,hh]=bodyBox(c);
    ctx.setLineDash([5,4]); ctx.lineWidth=1.2; ctx.strokeStyle='rgba(240,166,60,.75)';
    rr(ctx,-hw,-hh,hw*2,hh*2,6); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
  drawLabel(c);
}
function hotTerm(c,side,i){
  if(hover && hover.type==='term' && hover.c===c.id && hover.t===side && hover.i===i) return true;
  if(pendingWire && pendingWire.c===c.id && pendingWire.t===side && pendingWire.i===i) return true;
  return false;
}
function termDot(g,x,y,val,hot){
  if(hot){ g.beginPath(); g.arc(x,y,8,0,6.2832); g.strokeStyle=withAlpha('#f0a63c',.9); g.lineWidth=1.5; g.stroke(); }
  g.beginPath(); g.arc(x,y,4.2,0,6.2832);
  g.fillStyle=val?COL.hot:'#0d0d0b'; g.fill();
  g.lineWidth=1.5; g.strokeStyle=val?'#ffce7a':COL.term; g.stroke();
}
function pinLabel(g,txt,x,y,val,over){
  g.font='600 8.5px "IBM Plex Mono",monospace';
  g.textAlign='left'; g.textBaseline='middle';
  g.fillStyle=val?'#d9a048':'#7a766b';
  g.fillText(txt,x,y);
  if(over){
    const w=g.measureText(txt).width;
    g.strokeStyle=g.fillStyle; g.lineWidth=1;
    g.beginPath(); g.moveTo(x-1,y-5.5); g.lineTo(x+w+1,y-5.5); g.stroke();
  }
}
function drawBody(g,c,now){
  const k=CAT[c.type].kind;
  if(k==='gate') drawGate(g,c);
  else if(c.type==='SW') drawSwitch(g,c);
  else if(c.type==='CLK') drawClock(g,c);
  else if(k==='seq') drawSeq(g,c);
  else drawLED(g,c);
}
/* --- gate renderer: body height scales with input count, shape keyed on base name (replaced for 3/4-input support) --- */
function drawGate(g,c){
  const t=c.type, terms=localTerms(c);
  const base=t.replace(/(3|4)$/,'');            // AND4 -> AND, NOR3 -> NOR
  const neg = base==='NAND'||base==='NOR'||base==='XNOR'||base==='NOT';
  const n=CAT[t].ins;
  const H = n>=4 ? 26 : n===3 ? 25 : 22;        // body half-height grows with pin count
  const inEdge = (base==='XOR'||base==='XNOR') ? -34 : (n===1 ? -26 : -30);
  const outEdge = {AND:6+H, BUF:28, NAND:6+H+10, OR:30, NOR:40, XOR:30, XNOR:40, NOT:38}[base];
  g.lineWidth=2;
  terms.ins.forEach((p,i)=>{
    g.strokeStyle=c.in[i]?COL.hot:COL.stub;
    g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(inEdge,p[1]); g.stroke();
  });
  g.strokeStyle=c.out[0]?COL.hot:COL.stub;
  g.beginPath(); g.moveTo(outEdge,0); g.lineTo(46,0); g.stroke();
  const hov=hover&&hover.type==='comp'&&hover.id===c.id;
  g.fillStyle=hov?'#22221e':COL.body;
  g.strokeStyle=sel.comps.has(c.id)?COL.hot:COL.stroke;
  g.beginPath();
  switch(base){
    case 'AND': case 'NAND':
      g.moveTo(-30,-H); g.lineTo(6,-H); g.arc(6,0,H,-Math.PI/2,Math.PI/2); g.lineTo(-30,H); g.closePath(); break;
    case 'OR': case 'NOR': case 'XOR': case 'XNOR':
      g.moveTo(-30,-H); g.quadraticCurveTo(4,-H,30,0);
      g.quadraticCurveTo(4,H,-30,H); g.quadraticCurveTo(-16,0,-30,-H); g.closePath(); break;
    default:
      g.moveTo(-26,-20); g.lineTo(28,0); g.lineTo(-26,20); g.closePath();
  }
  g.fill(); g.stroke();
  if(base==='XOR'||base==='XNOR'){
    g.beginPath(); g.moveTo(-38,-H); g.quadraticCurveTo(-24,0,-38,H); g.stroke();
  }
  if(neg){
    g.beginPath(); g.arc(base==='NOT'?33:(base==='NAND'?6+H+5:35),0,5,0,6.2832);
    g.fillStyle=COL.body; g.fill(); g.stroke();
  }
  terms.ins.forEach((p,i)=>termDot(g,p[0],p[1],c.in[i],hotTerm(c,'in',i)));
  terms.outs.forEach((p,i)=>termDot(g,p[0],p[1],c.out[i],hotTerm(c,'out',i)));
}
function drawSeq(g,c){
  const ff=isFF(c.type);
  const hw=ff?34:28, hh=ff?26:18;
  const terms=localTerms(c);
  g.lineWidth=2;
  terms.ins.forEach((p,i)=>{
    g.strokeStyle=c.in[i]?COL.hot:COL.stub;
    g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(-hw,p[1]); g.stroke();
  });
  terms.outs.forEach((p,i)=>{
    g.strokeStyle=c.out[i]?COL.hot:COL.stub;
    g.beginPath(); g.moveTo(hw,p[1]); g.lineTo(p[0],p[1]); g.stroke();
  });
  const hov=hover&&hover.type==='comp'&&hover.id===c.id;
  rr(g,-hw,-hh,hw*2,hh*2,7);
  g.fillStyle=hov?'#22221e':COL.body; g.fill();
  g.strokeStyle=sel.comps.has(c.id)?COL.hot:COL.stroke; g.lineWidth=2; g.stroke();
  if(ff){
    pinLabel(g, c.type==='DFF'?'D':c.type==='JKFF'?'J':'T', -29, -18, c.in[0], false);
    g.beginPath(); g.moveTo(-34,-10.5); g.lineTo(-34,-1.5); g.lineTo(-26.5,-6); g.closePath();
    g.fillStyle=c.in[1]?COL.hot:'#6e6a5e'; g.fill();
    pinLabel(g,'PRE',-29,6,c.in[2],false);
    pinLabel(g,'CLR',-29,18,c.in[3],false);
    pinLabel(g,'Q',26,-12,c.out[0],false);
    pinLabel(g,'Q',26,12,c.out[1],true);
  }else{
    pinLabel(g,'S',-24,-10,c.in[0],false);
    pinLabel(g,'R',-24,10,c.in[1],false);
    pinLabel(g,'Q',22,-10,c.out[0],false);
    pinLabel(g,'Q',22,10,c.out[1],true);
  }
  terms.ins.forEach((p,i)=>termDot(g,p[0],p[1],c.in[i],hotTerm(c,'in',i)));
  terms.outs.forEach((p,i)=>termDot(g,p[0],p[1],c.out[i],hotTerm(c,'out',i)));
}
function drawSwitch(g,c){

  g.fillText(on?'1':'0', on?-11:11, .5);
  termDot(g,40,0,c.out[0],hotTerm(c,'out',0));

function drawClock(g,c){

  g.lineTo(-5,5); g.lineTo(5,5); g.stroke();

function drawLED(g,c){
  const col=CAT[c.type].color, on=!!c.in[0];
  g.strokeStyle=on?COL.hot:COL.stub; g.lineWidth=2;
  g.beginPath(); g.moveTo(-16,0); g.lineTo(-40,0); g.stroke();
  if(on){
    const gr=g.createRadialGradient(0,0,3,0,0,34);
    gr.addColorStop(0,withAlpha(col,.5)); gr.addColorStop(1,withAlpha(col,0));
    g.fillStyle=gr; g.beginPath(); g.arc(0,0,34,0,6.2832); g.fill();
  }
  g.beginPath(); g.arc(0,0,15,0,6.2832);
  g.fillStyle=COL.body; g.fill();
  g.strokeStyle=on?col:withAlpha(col,.4); g.lineWidth=2; g.stroke();
  g.beginPath(); g.arc(0,0,10,0,6.2832);
  g.fillStyle=on?col:withAlpha(col,.12); g.fill();
  termDot(g,-40,0,on,hotTerm(c,'in',0));
}
function drawLabel(c){
  if(!showLabels) return;
  const [,hh]=bodyBox(c);
  ctx.font='500 11px "IBM Plex Mono",monospace';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=sel.comps.has(c.id)?'#d9a048':'#77746a';
  ctx.fillText(c.label, c.x, c.y-hh-7);
}

/* ---------------- hit testing ---------------- */
function computeHover(w){
  const r=clamp(9/view.z,9,26);
  let best=null, bestD=r;
  for(const c of comps){
    const t=localTerms(c);
    const scan=(side,arr)=>arr.forEach((_,i)=>{
      const p=termWorld(c,side,i);
      const d=Math.hypot(p[0]-w[0],p[1]-w[1]);
      if(d<bestD){ bestD=d; best={type:'term',c:c.id,t:side,i}; }
    });
    scan('in',t.ins); scan('out',t.outs);
  }
  if(best) return best;
  for(const c of comps) if(compHit(c,w[0],w[1])) return {type:'comp',id:c.id};
  /* --- touch/iPad: wider wire pick radius for fingers --- */
  const wt=(lastPointerType==='touch'?13:7)/view.z+2;
  let bw=null, bd=wt;
  for(const wi of wires){
    const s=byId.get(wi.from.c), t=byId.get(wi.to.c);
    if(!s||!t) continue;
    const p1=termWorld(s,'out',wi.from.i), p2=termWorld(t,'in',wi.to.i);
    const [c1,c2]=bezierPts(p1,p2);
    for(let k=0;k<=20;k++){
      const u=k/20, v=1-u;
      const bx=v*v*v*p1[0]+3*v*v*u*c1[0]+3*v*u*u*c2[0]+u*u*u*p2[0];
      const by=v*v*v*p1[1]+3*v*v*u*c1[1]+3*v*u*u*c2[1]+u*u*u*p2[1];
      const d=Math.hypot(bx-w[0],by-w[1]);
      if(d<bd){ bd=d; bw={type:'wire',id:wi.id}; }
    }
  }
  return bw;
}

/* ---------------- interactions ---------------- */
function evtWorld(e){ const r=canvas.getBoundingClientRect(); return [(e.clientX-r.left-view.x)/view.z,(e.clientY-r.top-view.y)/view.z]; }
function evtScreen(e){ const r=canvas.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
function clientToWorld(cx,cy){ const r=canvas.getBoundingClientRect(); return [(cx-r.left-view.x)/view.z,(cy-r.top-view.y)/view.z]; }

canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const s=evtScreen(e);
  zoomAt(s[0],s[1],Math.exp(-e.deltaY*0.0012));
},{passive:false});
document.addEventListener('dragstart', e=>e.preventDefault());   // never let the browser's native drag steal pointer drags

function onDown(e){
  lastPointerType=e.pointerType||'mouse';
  if(palDrag) return;                       // a palette drag is in flight — ignore the canvas
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  $('#hint').hidden=true;

  if(pointers.size===2){
    if(drag && drag.mode==='move'){
      for(const it of drag.items){ const c=byId.get(it.id); if(c){ c.x=it.x; c.y=it.y; } }
    }
    const pts=[...pointers.values()];
    const r=canvas.getBoundingClientRect();
    const mid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
    drag={mode:'pinch', d0:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1, z0:view.z,
          w0:[(mid.x-r.left-view.x)/view.z,(mid.y-r.top-view.y)/view.z]};
    return;
  }
  if(e.button===1 || e.button===2 || spaceHeld){
    drag={mode:'pan', last:[e.clientX,e.clientY]};
    canvas.style.cursor='grabbing';
    return;
  }
  const w=evtWorld(e); mouseWorld=w;

  if(placing){ placeAt(w, e.shiftKey); return; }

  hover=computeHover(w);

  if(hover && hover.type==='term'){
    if(pendingWire){
      const b={c:hover.c,t:hover.t,i:hover.i};
      const a=pendingWire;
      if(!(a.c===b.c&&a.t===b.t&&a.i===b.i) && tryConnect(a,b)){ pendingWire=null; updateStatusUI(); return; }
    }
    pendingWire={c:hover.c,t:hover.t,i:hover.i};
    drag={mode:'wire'};
    updateStatusUI();
    return;
  }
  if(hover && hover.type==='comp'){
    const id=hover.id;
    if(e.shiftKey){ sel.comps.has(id)? sel.comps.delete(id) : sel.comps.add(id); }
    else if(!sel.comps.has(id)){ sel.comps.clear(); sel.comps.add(id); }
    updateInspector();
    drag={mode:'move', startW:w, startS:evtScreen(e), snap0:serialize(), moved:false, clickId:id,
          items:[...sel.comps].map(cid=>{const c=byId.get(cid); return c?{id:cid,x:c.x,y:c.y}:null;}).filter(Boolean)};
    return;
  }
  if(hover && hover.type==='wire'){
    /* --- wire delete: double-tap a wire to remove it instantly --- */
    const now=performance.now();
    if(lastWire && lastWire.id===hover.id && (now-lastWire.t)<400){
      sel.wires.clear(); sel.wires.add(hover.id);
      deleteSelectedWires();
      lastWire=null; return;
    }
    lastWire={id:hover.id,t:now};
    if(!e.shiftKey) selClear();
    sel.wires.add(hover.id);
    updateInspector();
    return;
  }
  if(!e.shiftKey) selClear();
  updateInspector();
  drag={mode:'marquee', startW:w, curW:w, add:e.shiftKey, base:new Set(sel.comps)};
}

function onMove(e){
  lastPointerType=e.pointerType||lastPointerType;
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag && drag.mode==='pinch'){
    if(pointers.size>=2){
      const pts=[...pointers.values()];
      const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
      const r=canvas.getBoundingClientRect();
      const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
      view.z=clamp(drag.z0*d/drag.d0,.25,2.5);
      view.x=(mid.x-r.left)-drag.w0[0]*view.z;
      view.y=(mid.y-r.top)-drag.w0[1]*view.z;
      updateViewUI();
    }
    return;
  }
  const w=evtWorld(e); mouseWorld=w;
  $('#statXY').textContent=Math.round(w[0])+', '+Math.round(w[1]);
  if(!drag){ hover=computeHover(w); updateCursor(); return; }
  if(drag.mode==='pan'){
    view.x+=e.clientX-drag.last[0]; view.y+=e.clientY-drag.last[1];
    drag.last=[e.clientX,e.clientY]; updateViewUI(); return;
  }
  if(drag.mode==='move'){
    const s=evtScreen(e);
    if(!drag.moved && Math.hypot(s[0]-drag.startS[0],s[1]-drag.startS[1])>4) drag.moved=true;
    if(drag.moved){
      const dx=w[0]-drag.startW[0], dy=w[1]-drag.startW[1];
      for(const it of drag.items){ const c=byId.get(it.id); if(c){ c.x=Math.round(it.x+dx); c.y=Math.round(it.y+dy); } }
    }
    return;
  }
  if(drag.mode==='marquee'){ drag.curW=w; previewMarqueeSel(); return; }
  if(drag.mode==='wire'){ hover=computeHover(w); return; }
}

function onUp(e){
  pointers.delete(e.pointerId);
  if(drag && drag.mode==='pinch'){ if(pointers.size<2) drag=null; return; }
  if(!drag) return;
  const d=drag; drag=null;
  canvas.style.cursor=''; updateCursor();
  if(d.mode==='pan') return;
  if(d.mode==='marquee'){ finalizeMarquee(d); return; }
  if(d.mode==='move'){
    if(d.moved){ pushHist(d.snap0); markDirty(); }
    else{
      const c=byId.get(d.clickId);
      if(c && c.type==='SW'){ c.state=c.state?0:1; markDirty(); }
    }
    updateInspector();
    return;
  }
  if(d.mode==='wire') finishWire();
}

function placeAt(w, keep){
  const c=mkComp(placing.type,w[0],w[1],{rot:placing.rot});
  pushHist();
  comps.push(c); reindex(); markDirty(); updateCounts();
  selClear(); sel.comps.add(c.id); updateInspector();
  if(!keep){ placing=null; syncPalette(); updateStatusUI(); }
}
function tryConnect(a,b){
  if(a.c===b.c && a.t===b.t && a.i===b.i) return false;
  let src,dst;
  if(a.t==='out'&&b.t==='in'){ src=a; dst=b; }
  else if(a.t==='in'&&b.t==='out'){ src=b; dst=a; }
  else{ toast('Wires run from an output pin to an input pin','err'); return false; }
  const sc=byId.get(src.c), dc=byId.get(dst.c);
  if(!sc||!dc) return false;
  if(src.i>=sc.out.length || dst.i>=dc.in.length) return false;
  pushHist();
  addWire(src,dst); markDirty(); updateCounts();
  return true;
}
function finishWire(){
  const pw=pendingWire; if(!pw) return;
  const h=(hover&&hover.type==='term')? {c:hover.c,t:hover.t,i:hover.i} : null;
  if(!h){ pendingWire=null; updateStatusUI(); return; }
  if(h.c===pw.c&&h.t===pw.t&&h.i===pw.i) return;
  tryConnect(pw,h);
  pendingWire=null; updateStatusUI();
}
function previewMarqueeSel(){
  if(!drag||drag.mode!=='marquee') return;
  const x1=Math.min(drag.startW[0],drag.curW[0]), x2=Math.max(drag.startW[0],drag.curW[0]);
  const y1=Math.min(drag.startW[1],drag.curW[1]), y2=Math.max(drag.startW[1],drag.curW[1]);
  sel.comps = drag.add? new Set(drag.base) : new Set();
  for(const c of comps) if(c.x>=x1&&c.x<=x2&&c.y>=y1&&c.y<=y2) sel.comps.add(c.id);
}
function finalizeMarquee(d){
  const x1=Math.min(d.startW[0],d.curW[0]), x2=Math.max(d.startW[0],d.curW[0]);
  const y1=Math.min(d.startW[1],d.curW[1]), y2=Math.max(d.startW[1],d.curW[1]);
  sel.comps = d.add? new Set(d.base) : new Set();
  for(const c of comps) if(c.x>=x1&&c.x<=x2&&c.y>=y1&&c.y<=y2) sel.comps.add(c.id);
  updateInspector();
}
function updateCursor(){
  if(spaceHeld){ canvas.style.cursor='grab'; return; }
  if(placing){ canvas.style.cursor='crosshair'; return; }
  if(!hover){ canvas.style.cursor='default'; return; }
  if(hover.type==='term'){ canvas.style.cursor='crosshair'; return; }
  if(hover.type==='comp'){ const c=byId.get(hover.id); canvas.style.cursor=(c&&c.type==='SW')?'pointer':'move'; return; }
  canvas.style.cursor='pointer';
}

/* ---------------- editing operations ---------------- */
function deleteSelection(){
  if(!sel.comps.size && !sel.wires.size) return;
  pushHist();
  if(sel.comps.size){
    wires=wires.filter(w=>!sel.comps.has(w.from.c)&&!sel.comps.has(w.to.c));
    comps=comps.filter(c=>!sel.comps.has(c.id));
  }
  if(sel.wires.size) wires=wires.filter(w=>!sel.wires.has(w.id));
  reindex(); selClear(); markDirty(); updateCounts();
}
/* --- wire delete: remove only the selected wires, components untouched --- */
function deleteSelectedWires(){
  if(!sel.wires.size) return;
  const n=sel.wires.size;
  pushHist();
  wires=wires.filter(w=>!sel.wires.has(w.id));
  sel.wires.clear(); lastWire=null;
  updateInspector(); markDirty(); updateCounts();
  toast(n>1 ? (n+' wires removed') : 'Wire removed');
}
/* --- wire delete: keep the floating ✕ on the selected wire (screen coords, tracks pan/zoom) --- */
function updateWireDel(){
  const b=$('#wireDel');
  if(!sel.wires.size || sel.comps.size || pendingWire || placing){ b.hidden=true; return; }
  const w=wires.find(x=>sel.wires.has(x.id));
  if(!w){ b.hidden=true; return; }
  const s=byId.get(w.from.c), t=byId.get(w.to.c);
  if(!s||!t){ b.hidden=true; return; }
  const p1=termWorld(s,'out',w.from.i), p2=termWorld(t,'in',w.to.i);
  const [c1,c2]=bezierPts(p1,p2);
  const mx=(p1[0]+3*c1[0]+3*c2[0]+p2[0])/8;    // bezier midpoint at t=0.5
  const my=(p1[1]+3*c1[1]+3*c2[1]+p2[1])/8;
  b.hidden=false;
  b.style.left=(view.x+mx*view.z)+'px';
  b.style.top =(view.y+my*view.z-34)+'px';
}
function rotateSel(){
  if(placing){ placing.rot=((placing.rot+1)&3); return; }
  if(!sel.comps.size) return;
  pushHist();
  for(const id of sel.comps){ const c=byId.get(id); if(c) c.rot=((c.rot&3)+1)&3; }
  markDirty();
}
function duplicateSel(){
  if(!sel.comps.size) return;
  pushHist();
  const map=new Map(), news=[];
  for(const id of sel.comps){
    const c=byId.get(id); if(!c) continue;
    const n=mkComp(c.type,c.x+40,c.y+40);
    n.rot=c.rot;
    if(c.type==='SW') n.state=c.state;
    if(c.type==='CLK') n.period=c.period;
    if(isSeq(c.type)) n.q=c.q;
    map.set(id,n.id); comps.push(n); news.push(n);
  }
  for(const w of wires){
    if(map.has(w.from.c)&&map.has(w.to.c))
      wires.push({id:wid(),from:{c:map.get(w.from.c),t:'out',i:w.from.i},to:{c:map.get(w.to.c),t:'in',i:w.to.i}});
  }
  reindex();
  selClear(); news.forEach(n=>sel.comps.add(n.id));
  markDirty(); updateCounts(); updateInspector();
  toast('Duplicated '+news.length+' component'+(news.length>1?'s':''));
}

/* ---------------- keyboard ---------------- */
window.addEventListener('keydown', e=>{
  if(e.target && e.target.closest && e.target.closest('input,select,textarea')) return;
  if(!$('#modal').hidden){ if(e.key==='Escape') closeModal(); return; }
  const mod=e.ctrlKey||e.metaKey;
  if(e.code==='Space'){ spaceHeld=true; updateCursor(); e.preventDefault(); return; }
  const k=e.key.toLowerCase();
  if(mod&&k==='z'){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); return; }
  if(mod&&k==='y'){ e.preventDefault(); doRedo(); return; }
  if(mod&&k==='d'){ e.preventDefault(); duplicateSel(); return; }
  if(mod&&k==='a'){ e.preventDefault(); sel.comps=new Set(comps.map(c=>c.id)); sel.wires=new Set(wires.map(w=>w.id)); updateInspector(); return; }
  if(mod&&k==='s'){ e.preventDefault(); saveNow(); toast('Circuit saved to this browser','ok'); return; }
  switch(e.key){
    case 'Escape': onEscape(); break;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSelection(); break;
    case 'r': case 'R': rotateSel(); break;
    case 'f': case 'F': zoomFit(); break;
    case 't': case 'T': openTruth(); break;
    case '?': openHelp(); break;
  }
});
window.addEventListener('keyup', e=>{ if(e.code==='Space'){ spaceHeld=false; updateCursor(); } });
function onEscape(){
  if(!$('#modal').hidden){ closeModal(); return; }
  if($('#exMenu').classList.contains('open')){ $('#exMenu').classList.remove('open'); return; }
  if(palDrag){ palDrag=null; updateStatusUI(); return; }
  if(placing){ cancelModes(); return; }
  if(pendingWire){ pendingWire=null; updateStatusUI(); return; }
  selClear();
}
document.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) b.blur(); });
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('.dd')) $('#exMenu').classList.remove('open'); });

/* ---------------- palette: click-to-place AND drag-and-drop ---------------- */
const PALETTE=[
  {h:'Inputs'},
  {t:'SW'},{t:'CLK'},
  {h:'Gates · 2-in'},
  {t:'NOT'},{t:'BUF'},{t:'AND'},{t:'OR'},{t:'NAND'},{t:'NOR'},{t:'XOR'},{t:'XNOR'},
  /* --- 3/4-input gate palette group (added) --- */
  {h:'Gates · 3/4-in'},
  {t:'AND3'},{t:'AND4'},{t:'OR3'},{t:'OR4'},{t:'NAND3'},{t:'NAND4'},{t:'NOR3'},{t:'NOR4'},
  {h:'Sequential'},
  {t:'SRL'},{t:'DFF'},{t:'JKFF'},{t:'TFF'},
  {h:'Outputs'},
  {t:'LEDR'},{t:'LEDG'},{t:'LEDY'},
];

function makeThumb(type){
  const d=CAT[type], cv=document.createElement('canvas');
  const W=104, H=64, s=.56, dp=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*s*dp); cv.height=Math.round(H*s*dp);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  const g=cv.getContext('2d');
  g.scale(s*dp, s*dp); g.translate(W/2, H/2);
  const c={id:'_thumb', type, x:0, y:0, rot:0, label:'', state:0, period:1000, q:0, pc:0, fresh:true,
           in:new Array(d.ins).fill(0), out:new Array(d.outs).fill(0)};
  drawBody(g, c, 0);
  return cv;
}
/* --- collapsible sections: headers are buttons, items live in a .pal-sec wrapper --- */
function buildPalette(){
  const pal=$('#pal'); pal.innerHTML='';
  let sec=null;
  for(const it of PALETTE){
    if(it.h){
      sec=document.createElement('div');
      sec.className='pal-sec'; sec.dataset.sec=it.h;
      const h=document.createElement('button');
      h.type='button'; h.className='pal-h pal-toggle';
      h.title='Tap to fold / unfold';
      h.innerHTML='<span class="caret">▾</span>'+esc(it.h);
      h.addEventListener('click', ()=>{ sec.classList.toggle('fold'); saveFold(); });
      sec.appendChild(h); pal.appendChild(sec);
      continue;
    }
    const b=document.createElement('button');
    b.className='pal-item'; b.dataset.type=it.t; b.title=CAT[it.t].name;
    b.appendChild(makeThumb(it.t));
    const sp=document.createElement('span');
    if(isLED(it.t)) sp.innerHTML='<i class="dot" style="background:'+CAT[it.t].color+'"></i>';
    sp.appendChild(document.createTextNode(CAT[it.t].name));
    b.appendChild(sp);
    sec.appendChild(b);
  }
  applyFold();
  syncPalette();
}
function foldKeySet(){
  try{ const a=JSON.parse(localStorage.getItem(FOLDKEY)||'[]'); return new Set(Array.isArray(a)?a:[]); }
  catch(e){ return new Set(); }
}
function saveFold(){
  try{ localStorage.setItem(FOLDKEY, JSON.stringify([...document.querySelectorAll('#pal .pal-sec.fold')].map(s=>s.dataset.sec))); }
  catch(e){}
}
function applyFold(){
  const f=foldKeySet();
  document.querySelectorAll('#pal .pal-sec').forEach(s=>{ s.classList.toggle('fold', f.has(s.dataset.sec)); });
}
function syncPalette(){
  document.querySelectorAll('#pal .pal-item').forEach(b=>{
    b.classList.toggle('on', !!placing && b.dataset.type===placing.type);
  });
}
 $('#pal').addEventListener('pointerdown', e=>{
  const b=e.target.closest('.pal-item'); if(!b) return;
  // no preventDefault here: with touch-action:pan-y the browser may take over
  // for a vertical scroll and fire pointercancel — which we handle cleanly.
  palDrag={type:b.dataset.type, moved:false, sx:e.clientX, sy:e.clientY, wx:0, wy:0, over:false, vert:false};
  window.addEventListener('pointermove', onPalMove);
  window.addEventListener('pointerup', onPalUp);
  window.addEventListener('pointercancel', onPalUp);
});
function onPalMove(e){
  if(!palDrag) return;
  if(!palDrag.moved){
    const dx=e.clientX-palDrag.sx, dy=e.clientY-palDrag.sy;
    if(Math.hypot(dx,dy)<=6) return;
    /* --- touch/iPad: vertical gesture = scroll, hand it back to Safari --- */
    if(e.pointerType==='touch' && Math.abs(dx)<Math.abs(dy)*1.15){ palDrag.vert=true; return; }
    palDrag.moved=true;
  }
  if(palDrag.vert) return;
  const r=$('#stage').getBoundingClientRect();
  palDrag.over = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
  palDrag.wx=(e.clientX-r.left-view.x)/view.z;
  palDrag.wy=(e.clientY-r.top-view.y)/view.z;
}
function onPalUp(e){
  window.removeEventListener('pointermove', onPalMove);
  window.removeEventListener('pointerup', onPalUp);
  window.removeEventListener('pointercancel', onPalUp);
  const pd=palDrag; palDrag=null;
  if(!pd) return;
  /* scroll took over, or the gesture was cancelled — do nothing */
  if(pd.vert || !e || e.type==='pointercancel'){ syncPalette(); return; }
  if(pd.moved && pd.over){
    pushHist();
    const c=mkComp(pd.type, pd.wx, pd.wy);
    comps.push(c); reindex(); markDirty(); updateCounts();
    selClear(); sel.comps.add(c.id); updateInspector();
  }else if(!pd.moved){
    placing=(placing && placing.type===pd.type)? null : {type:pd.type, rot:0};
    updateStatusUI();
  }
  syncPalette();
}

/* ---------------- truth tables ---------------- */
function openTruth(){
  const ids=[...sel.comps];
  if(ids.length===1){
    const c=byId.get(ids[0]);
    if(c && CAT[c.type].kind==='gate'){ showGateTruth(c.type); return; }
  }
  showCircuitTruth();
}
function showGateTruth(type){
  const d=CAT[type], n=d.ins, L=['A','B','C','D'];
  let rows='';
  for(let m=0;m<(1<<n);m++){
    const bits=[]; for(let k=0;k<n;k++) bits[k]=(m>>(n-1-k))&1;
    const o=evalComp({type, in:bits, q:0, state:0, period:1000},0)[0]?1:0;
    rows+='<tr><td class="ix">'+m+'</td>'
        + bits.map(v=>'<td>'+v+'</td>').join('')
        + '<td class="sep"></td><td'+(o?'':' class="z"')+'>'+o+'</td></tr>';
  }
  openModal(
    '<div class="m-title">Truth table — '+esc(d.name)+'</div>'
    +'<div class="m-body">'+n+' input'+(n>1?'s':'')+' · '+(1<<n)+' row'+(n>1?'s':'')
    +'. Inputs list top-to-bottom pins as '+L.slice(0,n).join(', ')+'; output is Q.</div>'
    +'<div class="ttwrap"><table class="tt"><thead><tr><th class="ix">#</th>'
    + L.slice(0,n).map(l=>'<th>'+l+'</th>').join('')
    + '<th class="sep"></th><th>Q</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="m-actions"><button class="btn" id="mClose">Close</button></div>');
  $('#mClose').addEventListener('click', closeModal);
}
function showCircuitTruth(){
  const msg=(t,b)=>openModal('<div class="m-title">'+t+'</div><div class="m-body">'+b+'</div>'
    +'<div class="m-actions"><button class="btn" id="mClose">Close</button></div>');
  if(comps.some(c=>c.type==='CLK'||isSeq(c.type)))
    return msg('Truth table — whole circuit',
      'This circuit contains a clock or flip-flops, so its outputs depend on time as well as on the switches. Select a single gate instead, or build a purely combinational circuit (switches → gates → LEDs) to table the whole thing.');
  const sws=comps.filter(c=>c.type==='SW').sort(labelSort);
  const leds=comps.filter(c=>isLED(c.type)).sort(labelSort);
  if(!sws.length || !leds.length)
    return msg('Truth table — whole circuit','A whole-circuit truth table needs at least one switch (input) and one LED (output).');
  if(sws.length>8)
    return msg('Truth table — whole circuit','Too many inputs: '+sws.length+' switches would need '+(1<<sws.length)+' rows (max 8 switches).');
  const saved=sws.map(c=>c.state);
  let rows='';
  for(let m=0;m<(1<<sws.length);m++){
    sws.forEach((c,k)=>{ c.state=(m>>(sws.length-1-k))&1; });
    settle(0);
    rows+='<tr><td class="ix">'+m+'</td>'
        + sws.map(c=>'<td>'+c.state+'</td>').join('')
        + '<td class="sep"></td>'
        + leds.map(c=>c.in[0]?'<td>1</td>':'<td class="z">0</td>').join('')
        + '</tr>';
  }
  sws.forEach((c,k)=>{ c.state=saved[k]; });
  settle(0);
  openModal(
    '<div class="m-title">Truth table — whole circuit</div>'
    +'<div class="m-body">'+sws.length+' input'+(sws.length>1?'s':'')+' · '+leds.length+' output'+(leds.length>1?'s':'')
    +' · '+(1<<sws.length)+' rows.</div>'
    +'<div class="ttwrap"><table class="tt"><thead><tr>'
    + sws.map(c=>'<th>'+esc(c.label)+'</th>').join('')
    + '<th class="sep"></th>'
    + leds.map(c=>'<th><span class="dot" style="background:'+CAT[c.type].color+'"></span>'+esc(c.label)+'</th>').join('')
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="m-actions"><button class="btn" id="mClose">Close</button></div>', true);
  $('#mClose').addEventListener('click', closeModal);
}

/* ---------------- examples ---------------- */
function exDivider(C,W){
  const clk=C('CLK',0,0,{label:'CLK'});
  const en =C('SW',0,90,{label:'EN',state:1});
  const g  =C('AND',160,45);
  W(clk,0,g,0); W(en,0,g,1);
  let drive=null;
  ['÷2','÷4','÷8'].forEach((lab,k)=>{
    const y=45+k*110;
    const ff=C('DFF',330,y);
    const led=C('LEDG',500,y,{label:lab});
    if(drive) W(drive,0,ff,1); else W(g,0,ff,1);
    W(ff,1,ff,0);            // Qbar -> D : toggle on every rising edge
    W(ff,0,led,0);
    drive=ff;
  });
}
function exSR(C,W){
  const s=C('SW',0,0,{label:'S',state:1});
  const r=C('SW',0,120,{label:'R'});
  const n1=C('NOR',160,0,{label:'QBAR'});
  const n2=C('NOR',160,120,{label:'Q'});
  W(s,0,n1,0); W(n1,0,n2,0); W(n2,0,n1,1); W(r,0,n2,1);
  const lq=C('LEDG',320,120,{label:'Q'});
  const lb=C('LEDR',320,0,{label:'QBAR'});
  W(n2,0,lq,0); W(n1,0,lb,0);
}
function exMajority(C,W){
  const a=C('SW',0,-40,{label:'A'});
  const b=C('SW',0,30,{label:'B'});
  const c=C('SW',0,100,{label:'C'});
  const g1=C('AND',180,-5);
  const g2=C('AND',180,65);
  const g3=C('AND',180,135);
  const g4=C('OR3',340,65,{label:'MAJ'});
  const led=C('LEDG',480,65,{label:'MAJ'});
  W(a,0,g1,0); W(b,0,g1,1);
  W(b,0,g2,0); W(c,0,g2,1);
  W(a,0,g3,0); W(c,0,g3,1);
  W(g1,0,g4,0); W(g2,0,g4,1); W(g3,0,g4,2);
  W(g4,0,led,0);
}
function exWide(C,W){
  const sw=[-45,-15,15,45].map((y,k)=>C('SW',0,y,{label:'ABCD'[k]}));
  const a4=C('AND4',230,0,{label:'ALL'});
  const n4=C('NOR4',230,120,{label:'NONE'});
  const o3=C('OR3',230,240,{label:'ANY'});
  const l1=C('LEDG',400,0);
  const l2=C('LEDR',400,120);
  const l3=C('LEDY',400,240);
  sw.forEach((s,k)=>{ W(s,0,a4,k); W(s,0,n4,k); });
  W(sw[0],0,o3,0); W(sw[1],0,o3,1); W(sw[2],0,o3,2);
  W(a4,0,l1,0); W(n4,0,l2,0); W(o3,0,l3,0);
}
const EXAMPLES=[

/* ---------------- boot self-test ---------------- */
function selfTest(){
  const T=(type,bits)=>evalComp({type, in:bits, q:0, state:0, period:1000},0)[0];
  const eq=(got,want,msg)=>{ if(got!==want) throw new Error('self-test: '+msg+' got '+got+' want '+want); };
  eq(T('AND',[0,1]),0,'AND');  eq(T('AND',[1,1]),1,'AND');
  eq(T('OR',[0,1]),1,'OR');    eq(T('NAND',[1,1]),0,'NAND');
  eq(T('NOR',[0,0]),1,'NOR');  eq(T('XOR',[1,0]),1,'XOR');
  eq(T('NOT',[0]),1,'NOT');    eq(T('NOT',[1]),0,'NOT');
  eq(T('AND3',[1,1,1]),1,'AND3'); eq(T('AND3',[1,0,1]),0,'AND3');
  eq(T('AND4',[1,1,1,1]),1,'AND4'); eq(T('AND4',[1,1,0,1]),0,'AND4');
  eq(T('OR3',[0,0,1]),1,'OR3');  eq(T('OR3',[0,0,0]),0,'OR3');
  eq(T('OR4',[0,0,0,1]),1,'OR4'); eq(T('OR4',[0,0,0,0]),0,'OR4');
  eq(T('NAND3',[1,1,1]),0,'NAND3'); eq(T('NAND3',[0,1,1]),1,'NAND3');
  eq(T('NAND4',[1,1,1,1]),0,'NAND4'); eq(T('NAND4',[1,1,1,0]),1,'NAND4');
  eq(T('NOR3',[0,0,0]),1,'NOR3'); eq(T('NOR3',[0,0,1]),0,'NOR3');
  eq(T('NOR4',[0,0,0,0]),1,'NOR4'); eq(T('NOR4',[1,0,0,0]),0,'NOR4');
}

function boot(){
  try{
    $('#icNew').innerHTML=icon('file');
    $('#icEx').innerHTML=icon('layers');
    $('#icImp').innerHTML=icon('up');
    $('#icExp').innerHTML=icon('down');
    $('#icTt').innerHTML=icon('table');
    $('#btnHelp').innerHTML=icon('help');
    $('#btnUndo').innerHTML=icon('undo');
    $('#btnRedo').innerHTML=icon('redo');
    $('#inspClose').innerHTML=icon('x');
    $('#hintClose').innerHTML=icon('x');
    $('#btnFit').innerHTML=icon('fit');
    $('#wireDel').innerHTML=icon('x');       /* --- wire delete --- */

    selfTest();
    buildPalette();
    buildExamples();
    wireUI();

    let restored=false;
    try{
      const s=localStorage.getItem(KEY);
      if(s){ loadData(s); restored=true; }
    }catch(err){ restored=false; }

    if(!restored){
      loadExample(EXAMPLES[0], false);
      $('#hint').hidden=false;
    }
    zoomFit();

    updateCounts(); updateViewUI(); updateStatusUI(); updateInspector();
    requestAnimationFrame(frame);
  }catch(err){
    fatal(err && (err.stack||err.message) || String(err));
  }
}
boot();
</script>

</html>
